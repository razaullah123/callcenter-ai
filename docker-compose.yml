# Local / single-host deployment: voice agent + Postgres (pgvector).
#   docker compose up -d --build
#   docker compose exec agent python scripts/clone_reference_data.py --source "$SOURCE_DATABASE_URL"   # first run
# Console: http://<host>:8080/console · IVR: ws://<host>:8080/ws/voice-pipeline

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hmg_voice_agent
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d hmg_voice_agent"]
      interval: 10s
      retries: 10

  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@db:5432/hmg_voice_agent
      LOG_CONSOLE: "false"
    ports:
      - "8080:8080"
    volumes:
      - logs:/app/logs
      - phrases:/app/models/phrases       # pre-synthesized greeting / filler audio survives restarts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  logs:
  phrases:
