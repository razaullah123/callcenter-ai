# The whole HMG call as one flow graph. Generated by build.py from the tested step texts of
# skills/authenticate + skills/book_appointment; edit here or on the console canvas.
start: greeting_intent
variables:
  intent:
    type: string
    enum:
    - book
    - other
    description: book = a new appointment; other = any other request they made (cancel, reschedule, results, reports,
      insurance, a complaint …); null if they haven't said what they need
  confirm_now:
    type: string
    enum:
    - 'yes'
    - 'no'
    description: 'the caller''s answer to ''Would you like me to confirm it now?'': yes or no; null if they didn''t
      answer that question'
  next_step:
    type: string
    enum:
    - done
    - new_booking
    - other_request
    description: 'only when answering ''anything else?'' or after a booking: done = nothing else / goodbye / thanks;
      new_booking = wants another appointment; other_request = anything else they ask for; null if they are still
      busy with this booking (e.g. answering whether to confirm it)'
infer:
  find_hospital_by_name:
    true:
      result.status: match
    set:
      project_id: result.hospital.project_id
      project_name: result.hospital.name_ar
      project_name_en: result.hospital.name_en
  resolve_location:
    set:
      location_lat: result.location.latitude
      location_lng: result.location.longitude
  mssql_get_clinics_for_project:
    set:
      project_id: args.projectId
  mssql_get_TopFive_nearestClinic_have_doctorSlots:
    set:
      clinic_id: args.clinicId
      date_mode: =nearest
  mssql_get_TopFive_availableDoctors_with_slots_byDate:
    set:
      clinic_id: args.clinicId
      date_mode: =date
      date: args.date
  api_book_Appointment:
    set:
      booked: =true
      appointment_no: result.*appointmentno
      doctor_id: args.DoctorID
      slot_date: args.StrAppointmentDate
      slot_time: args.StartTime
  mssql_confirm_appointment:
    set:
      confirm_done: =true
reset:
  project_id:
  - clinic_id
  - date_mode
  - date
  - booked
  - appointment_no
  - doctor_id
  - slot_date
  - slot_time
  - confirm_done
  clinic_id:
  - date_mode
  - date
  - booked
  - appointment_no
  - doctor_id
  - slot_date
  - slot_time
  - confirm_done
nodes:
- id: greeting_intent
  type: conversation
  position:
    x: 0
    y: 200
  extract:
  - intent
  instructions: 'The caller has been greeted. Find out what they need. If they only greeted or it isn''t clear yet,
    ask exactly: English "How can I help you today?" / Arabic "كيف أقدر أخدمك؟". Don''t ask for the mobile number
    here and don''t answer the request yourself.'
- id: other_service
  type: transfer
  position:
    x: 300
    y: 420
  reason: caller asked for a service that isn't available by phone yet
- id: ask_mobile
  type: conversation
  position:
    x: 300
    y: 200
  tools:
  - mssql_get_patient_info
  instructions: 'The caller wants to book. Acknowledge it in a few words and ask for their registered mobile number
    to verify them — e.g. "أبشر، عشان أحجز لك أحتاج رقم جوالك المسجل".

    Ask for the caller''s registered mobile number — don''t explain its format unless what they said was wrong

    (then: 10 digits starting with 05).

    As soon as they say it, call mssql_get_patient_info with mobileNo (use the parsed mobile).

    If the result says no file is registered, tell them to contact the support team to register first,

    then ask if there is anything else (they cannot be served without a file).

    If the number was incomplete or unclear, ask them to say it again slowly, or to type it on the phone keypad

    followed by the hash key (Arabic: "أو اكتبه بلوحة المفاتيح وبعده علامة المربع").'
- id: lookup_patient
  type: tool
  position:
    x: 600
    y: 200
  tool: mssql_get_patient_info
  args:
    mobileNo: parsed.mobile
- id: no_file
  type: conversation
  position:
    x: 900
    y: 420
  extract:
  - next_step
  instructions: No patient file is registered with this number. Tell the caller to contact the support team to register
    first (they cannot be served without a file), then ask if there is anything else. If they give another number,
    it is looked up.
- id: choose_file
  type: conversation
  position:
    x: 900
    y: 0
  instructions: 'Several files share this number. Ask for the caller''s date of birth and first name in one question,

    then call select_patient. If it does not match, ask once more, then the system transfers the call.

    '
- id: send_otp
  type: tool
  position:
    x: 1200
    y: 200
  tool: api_send_otp_request
  args:
    Channel: =WhatsApp
- id: ask_otp
  type: conversation
  position:
    x: 1500
    y: 200
  tools:
  - api_verify_otp
  - api_send_otp_request
  instructions: 'Ask for the code. When the caller says digits, call api_verify_otp with Otp (use the parsed code).

    If the code was unclear, they can also type it on the keypad followed by the hash key.

    If the code is wrong: say so and ask whether they want to repeat it or receive it by text message;

    for a text message call api_send_otp_request with Channel SMS.

    If they did not receive the WhatsApp message, offer SMS the same way.


    If sending the code failed, apologise briefly and offer to send it by text message.'
- id: verify_otp
  type: tool
  position:
    x: 1800
    y: 200
  tool: api_verify_otp
  args:
    Otp: parsed.code
- id: verification_failed
  type: transfer
  position:
    x: 1800
    y: 420
  reason: verification code attempts exhausted
- id: confirm_identity
  type: conversation
  position:
    x: 2100
    y: 200
  instructions: The caller is verified. The system asks "Am I speaking to <name>?" and handles the answer (a clear
    no transfers the call). Once they confirm, the booking starts.
- id: hospital
  type: conversation
  position:
    x: 2400
    y: 200
  tools:
  - find_hospital_by_name
  - resolve_location
  - mssql_get_Projects_from_Location
  - mssql_get_clinics_for_project
  auto_call:
  - tool: mssql_get_Projects_from_Location
    args:
      latitude: slots.location_lat
      longitude: slots.location_lng
    blocking: true
  instructions: "Ask exactly (the caller's own words may already answer it — then don't ask):\n  English: \"Please\
    \ tell me your location so I can find the nearest hospitals to you, or would you like to book\n            at\
    \ a specific hospital?\"\n  Arabic:  \"ممكن تعطيني موقعك عشان أحدد لك أقرب المستشفيات، ولا تبي تحجز في مستشفى\
    \ معين؟\"\n- Specific hospital: call find_hospital_by_name with just the name. \"match\" → don't ask them to\
    \ confirm it; go\n  straight to the next step (the symptoms question), you may start with the hospital's name\
    \ (\"Olaya Hospital.\"). \"ambiguous\" → ask which of the candidates (max 3) they mean. \"none\" → ask them\
    \ to repeat\n  the name or offer to use their location instead.\n- If the caller says where they ARE (\"I'm\
    \ at / near / in Olaya\", \"أنا في العليا\", \"ساكن بالملقا\"), that is a\n  location, even when the place shares\
    \ its name with a hospital (Olaya, Al Hamra, Al Rayyan): use\n  resolve_location and offer the nearest hospitals\
    \ — don't pick the hospital with that name.\n- Location: ask for their district / city, call resolve_location.\
    \ \"match\" or \"city\" → the system fetches the\n  nearby hospitals itself (mssql_get_Projects_from_Location):\
    \ read out the 3 nearest and ask which one.\n  \"ambiguous\" → confirm which place they mean. \"none\" → ask\
    \ again.\n- When the caller picks a hospital from a list, call mssql_get_clinics_for_project with its project_id.\n"
- id: symptoms_and_clinic
  type: conversation
  position:
    x: 2700
    y: 200
  tools:
  - find_hospital_by_name
  - resolve_location
  - mssql_get_clinics_for_project
  - mssql_get_TopFive_nearestClinic_have_doctorSlots
  - mssql_get_TopFive_availableDoctors_with_slots_byDate
  auto_call:
  - tool: mssql_get_clinics_for_project
    args:
      projectId: slots.project_id
  instructions: "The clinic list of the chosen hospital is already in the conversation (fetched by the system).\n\
    1. If the caller already named a specialty or clinic (e.g. \"cardiology\", \"عيادة الجلدية\"), don't ask about\n\
    \   symptoms: confirm the matching clinic from the list. Otherwise, if they haven't described symptoms yet,\
    \ ask\n   exactly:\n     English: \"What symptoms are you suffering from, so that I can suggest the right clinic\
    \ for you?\"\n     Arabic:  \"وش الأعراض اللي تعاني منها، عشان أقترح لك العيادة المناسبة؟\"\n   Never ask again\
    \ for something they already said.\nNever suggest a clinic before the caller has named a symptom or a specialty;\
    \ if their reply was unclear or\nunrelated (e.g. just \"thank you\"), ask what they are feeling. Never say sorry\
    \ about \"your symptoms\" in general.\n2. One symptom is enough to choose a clinic — don't ask for more symptoms.\
    \ When the caller describes\n   symptoms, suggest ONE clinic from the clinic list that fits them (say only its\
    \ name), exactly:\n     English: \"Based on your <symptoms>, we suggest the <clinic>. Would you like to book\
    \ there, or would you\n               prefer another clinic?\"\n     Arabic:  \"بناءً على <الأعراض>، نقترح لك\
    \ <العيادة>. تبي تحجز فيها، ولا تفضل عيادة ثانية؟\"\n   Never suggest a clinic that is not in the list. (Serious\
    \ symptoms: start with one short line of empathy\n   naming the symptom.)\n   Prefer the general specialty clinic\
    \ (e.g. \"الأمراض الجلدية والتجميل\" over a sub-clinic); for general\n   complaints prefer internal medicine\
    \ / family medicine; children → pediatric clinics; chest pain or\n   palpitations → cardiology (القلب), not\
    \ the chest / pulmonary clinic (الصدرية).\nIf the caller asks for \"another doctor\" or a particular doctor\
    \ while you are suggesting a clinic, that is not\na rejection of the clinic: keep the clinic, say you'll give\
    \ them the doctor choice right after, and go on\n(earliest or a specific date). Then, in the doctor step, read\
    \ the doctors to choose from instead of suggesting one.\nOnly suggest a different clinic when they reject the\
    \ clinic itself.\n3. Once they agree to the clinic, ask exactly (unless they already said a date or \"the earliest\"\
    ):\n     English: \"Would you like the earliest available appointment, or do you have a specific date in mind?\"\
    \n     Arabic:  \"تبي أقرب موعد متاح، ولا عندك تاريخ معين؟\"\n   - Earliest → call mssql_get_TopFive_nearestClinic_have_doctorSlots\
    \ (projectId, clinicId).\n   - Specific date → call mssql_get_TopFive_availableDoctors_with_slots_byDate (projectId,\
    \ clinicId, date YYYY-MM-DD).\nIf the result has no doctors: if the clinic list has another clinic with a similar\
    \ name (e.g. \"الجلدية\" and\n\"الأمراض الجلدية والتجميل\"), try that clinic before telling the caller. Otherwise\
    \ offer another date or the\nearliest appointment.\n"
- id: doctor_and_time
  type: conversation
  position:
    x: 3000
    y: 200
  tools:
  - find_hospital_by_name
  - resolve_location
  - mssql_get_TopFive_nearestClinic_have_doctorSlots
  - mssql_get_TopFive_availableDoctors_with_slots_byDate
  - api_book_Appointment
  instructions: "Use the doctor list from the last slot search.\n1. Suggest the FIRST doctor only, exactly (him\
    \ / her and الدكتور / الدكتورة by the doctor's name; Arabic name in\n   Arabic calls):\n     English: \"We suggest\
    \ Dr. <name>. Would you like to book with him, or would you prefer another doctor?\"\n     Arabic:  \"نقترح\
    \ لك الدكتور <الاسم>. تبي تحجز معه، ولا تفضل دكتور ثاني؟\"\n2. \"Another doctor\" → in ONE sentence read the\
    \ next 3 doctors' names together (fewer if fewer remain) and ask\n   which one — never offer them one at a time.\
    \ If none remain and has_next_page is true, call the same slot tool\n   again with page + 1.\n3. Once a doctor\
    \ is chosen, offer that doctor's 3 earliest times, exactly — the day once, then each time in\n   digits with\
    \ its AM / PM, copied from the brackets next to each slot (English \"8:15 AM\", Arabic \"8:15 صباحاً\"):\n \
    \    English: \"The available time slots with Dr. <name> are <day> at 8 AM, 8:15 AM and 8:30 AM. Which time\
    \ slot\n               suits you? There are more slots available, so please let me know if you need another\
    \ time.\"\n     Arabic:  \"الأوقات المتاحة مع الدكتور <الاسم> هي <اليوم> الساعة 8 صباحاً، 8:15 صباحاً، و8:30\
    \ صباحاً. أي وقت\n               يناسبك؟ فيه أوقات ثانية متاحة، إذا تبي وقت ثاني علمني.\"\n   Say the last sentence\
    \ only if that doctor has more times than the three you read. \"Another time\" → the\n   next 3.\n4. When a\
    \ time is chosen, call api_book_Appointment right away WITHOUT saying anything first, with ProjectID,\n   ClinicID,\
    \ DoctorID, StartTime (HH:MM) and StrAppointmentDate (YYYY-MM-DD, the date part of the slot).\n   The system\
    \ then asks you to confirm with the caller before anything is booked, exactly:\n     English: \"Shall I book\
    \ your appointment with Dr. <name> at the <clinic>, <hospital>, on <day> at <time,\n               e.g. 8:15\
    \ AM>?\"\n     Arabic:  \"أحجز لك الموعد مع الدكتور <الاسم> في <العيادة> ب<المستشفى>، يوم <اليوم> الساعة <الوقت،\
    \ مثل 8:15\n               صباحاً>؟\"\n   Never say it is booked before the system confirms. The system books\
    \ it when the caller says yes.\nUse the weekday exactly as written next to each date in the slot list (e.g.\
    \ \"الأحد (today)\" → \"اليوم الأحد\").\nIf no slots at all: offer another date, the earliest appointment, or\
    \ another clinic / hospital.\nIf the caller asks for a specific day, search that day (mssql_get_TopFive_availableDoctors_with_slots_byDate);\n\
    the earliest-slots list only covers the first available days, so it never means another day is full.\n"
- id: confirm_booking
  type: conversation
  position:
    x: 3300
    y: 200
  tools:
  - find_hospital_by_name
  - resolve_location
  - mssql_get_TopFive_nearestClinic_have_doctorSlots
  - mssql_get_TopFive_availableDoctors_with_slots_byDate
  instructions: "The booking is parked until the caller says yes — NOTHING is booked yet. The system then asks you\
    \ to confirm with the caller before anything is booked, exactly:\n     English: \"Shall I book your appointment\
    \ with Dr. <name> at the <clinic>, <hospital>, on <day> at <time,\n               e.g. 8:15 AM>?\"\n     Arabic:\
    \  \"أحجز لك الموعد مع الدكتور <الاسم> في <العيادة> ب<المستشفى>، يوم <اليوم> الساعة <الوقت، مثل 8:15\n     \
    \          صباحاً>؟\"\n   Never say it is booked before the system confirms. The system books it when the caller\
    \ says yes.\nIf the caller wants a different time, doctor, day, clinic or hospital, handle that change instead\
    \ (the parked booking is dropped)."
- id: booked
  type: conversation
  position:
    x: 3600
    y: 200
  extract:
  - confirm_now
  tools:
  - find_hospital_by_name
  - resolve_location
  - mssql_confirm_appointment
  instructions: "The system has already told the caller the appointment is booked and asked whether to confirm it\
    \ now. Do not\nsay it is confirmed before mssql_confirm_appointment succeeds.\nIf yes → call mssql_confirm_appointment\
    \ with appointment_no (the booked appointment number from \"Choices so far\")\nand project_id, then say exactly:\n\
    \  English: \"Your appointment is confirmed successfully. Is there anything else I can help you with?\"\n  Arabic:\
    \  \"تم تأكيد موعدك بنجاح. تحتاج أي خدمة ثانية؟\"\nIf no → just ask if they need anything else (\"Is there anything\
    \ else I can help you with?\" / \"تحتاج أي خدمة\nثانية؟\"). Ask it as a question and wait — don't say goodbye\
    \ in the same reply.\n"
- id: anything_else
  type: conversation
  position:
    x: 3900
    y: 200
  extract:
  - next_step
  instructions: 'If the appointment was just confirmed, say exactly: English "Your appointment is confirmed successfully.
    Is there anything else I can help you with?" / Arabic "تم تأكيد موعدك بنجاح. تحتاج أي خدمة ثانية؟". Otherwise
    ask if they need anything else ("Is there anything else I can help you with?" / "تحتاج أي خدمة ثانية؟") and
    wait for the answer.'
- id: new_booking
  type: set
  position:
    x: 3900
    y: 420
  set:
    intent: =book
    next_step: null
    project_id: null
    project_name: null
    project_name_en: null
    clinic_id: null
    date_mode: null
    date: null
    booked: null
    appointment: null
    appointment_no: null
    doctor_id: null
    slot_date: null
    slot_time: null
    confirm_done: null
    location_lat: null
    location_lng: null
    confirm_now: null
- id: goodbye
  type: end
  position:
    x: 4200
    y: 200
  say:
    ar: شكراً لاتصالك بمجموعة الدكتور سليمان الحبيب، مع السلامة.
    en: Thank you for calling Dr. Sulaiman Al Habib Medical Group. Goodbye!
edges:
- from: greeting_intent
  to: hospital
  when:
    all:
    - equals:
        intent: book
    - equals:
        identity_confirmed: true
- from: greeting_intent
  to: ask_mobile
  when:
    equals:
      intent: book
- from: greeting_intent
  to: other_service
  when:
    equals:
      intent: other
- from: ask_mobile
  to: lookup_patient
  when:
    equals:
      mobile_heard: true
- from: ask_mobile
  to: no_file
  when:
    equals:
      files_found: 0
- from: ask_mobile
  to: choose_file
  when:
    stage: awaiting_dob_and_name
- from: ask_mobile
  to: send_otp
  when:
    stage: send_otp
- from: lookup_patient
  to: no_file
  result: success
  when:
    equals:
      files_found: 0
- from: lookup_patient
  to: choose_file
  result: success
  when:
    stage: awaiting_dob_and_name
- from: lookup_patient
  to: send_otp
  result: success
  when:
    stage: send_otp
- from: lookup_patient
  to: ask_mobile
  result: failure
- from: no_file
  to: lookup_patient
  when:
    equals:
      mobile_heard: true
- from: no_file
  to: goodbye
  when:
    equals:
      next_step: done
- from: choose_file
  to: send_otp
  when:
    stage: send_otp
- from: send_otp
  to: ask_otp
  result: success
- from: send_otp
  to: ask_otp
  result: failure
- from: ask_otp
  to: verify_otp
  when:
    equals:
      code_heard: true
- from: ask_otp
  to: confirm_identity
  when:
    equals:
      verified: true
- from: verify_otp
  to: confirm_identity
  result: success
- from: verify_otp
  to: verification_failed
  result: failure
  when:
    equals:
      otp_exhausted: true
- from: verify_otp
  to: ask_otp
  result: failure
- from: confirm_identity
  to: hospital
  when:
    equals:
      identity_confirmed: true
- from: hospital
  to: symptoms_and_clinic
  when:
    filled:
    - project_id
- from: symptoms_and_clinic
  to: doctor_and_time
  when:
    filled:
    - clinic_id
- from: symptoms_and_clinic
  to: hospital
  when:
    empty:
    - project_id
- from: doctor_and_time
  to: booked
  when:
    filled:
    - booked
- from: doctor_and_time
  to: confirm_booking
  when:
    equals:
      awaiting_confirmation: true
- from: doctor_and_time
  to: symptoms_and_clinic
  when:
    empty:
    - clinic_id
- from: confirm_booking
  to: booked
  when:
    filled:
    - booked
- from: confirm_booking
  to: symptoms_and_clinic
  when:
    empty:
    - clinic_id
- from: confirm_booking
  to: doctor_and_time
  when:
    equals:
      awaiting_confirmation: false
- from: booked
  to: anything_else
  when:
    filled:
    - confirm_done
- from: booked
  to: anything_else
  when:
    equals:
      confirm_now: 'no'
- from: anything_else
  to: goodbye
  when:
    equals:
      next_step: done
- from: anything_else
  to: new_booking
  when:
    equals:
      next_step: new_booking
- from: anything_else
  to: other_service
  when:
    equals:
      next_step: other_request
- from: new_booking
  to: hospital
