[project]
name = "hmg-voice-agent"
version = "0.1.0"
description = "Voice-to-voice customer care agent for Dr. Sulaiman Al Habib Group (Najdi Arabic)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=2.2",
    "groq>=0.30",
    "openai>=1.60",
    "httpx>=0.27",
    "numpy>=1.26",
    "soxr>=0.5",
    "asyncpg>=0.30",
    "rapidfuzz>=3.9",
    "jsonschema>=4.23",
    "tzdata>=2024.1",   # IANA zones on Windows (Asia/Riyadh)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.18",   # Silero VAD (models/silero_vad.onnx)
    "livekit>=1.0",        # WebRTC AEC3 echo cancellation for telephony
    "pyjwt>=2.8",
    "websockets>=12",
    "cryptography>=42",   # secret store (Fernet)
    "jinja2>=3.1",        # flow templates ({{ var }}, {% if %}) — e.g. flows imported from Hamsa
    "pypdf>=4.0",         # knowledge base: text from PDF
    "python-docx>=1.1",   # knowledge base: text from DOCX
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
