# Booking suite. Spec: docs/flows/book_appointment.md (fixture HIS: evals/fixtures.py)

- id: book_by_name_nearest_ar
  suite: booking
  title: Hospital by name, symptoms → clinic, earliest, first doctor, first time
  caller:
    language: ar
    persona: رجل من الرياض عنده حبوب في وجهه من أسبوعين.
    goal: يحجز موعد في مستشفى العليا بأقرب موعد، يقبل أول دكتور يقترحونه وأول وقت، ويوافق على تأكيد الموعد.
    facts: {رقم الجوال: "0551234567", الرمز: "1234", المستشفى: مستشفى العليا, الأعراض: حبوب في الوجه, التاريخ: أقرب موعد}
    opening: ابي احجز موعد
  max_turns: 16
  expect:
    verified: true
    max_words_per_reply: 50
    tools_called: [find_hospital_by_name, mssql_get_clinics_for_project, mssql_get_TopFive_nearestClinic_have_doctorSlots, api_book_Appointment]
    tools_not_called: [mssql_cancel_appointment]
    booked: true
    booked_first_doctor: true
    slots: {project_id: 12, booked: true}
    language: ar
    gender: male
    max_questions_per_reply: 1

- id: book_by_location_en
  suite: booking
  title: English, nearby hospitals from location, specific date
  caller:
    language: en
    persona: A woman living in Al Olaya, Riyadh. She has had a skin rash for a few days.
    goal: Book at the nearest hospital to her, at a dermatology clinic, on next Tuesday. Accept the first doctor and the first time. When the agent reads back the booking and asks whether to go ahead, say yes. Only after it is booked, if asked whether to confirm the appointment now, say no, you will confirm later.
    facts: {mobile: "0559876543", code: "1234", location: "Al Olaya, Riyadh", symptoms: skin rash, date: next Tuesday}
    opening: Hello, I'd like to book an appointment
  max_turns: 16
  expect:
    verified: true
    max_words_per_reply: 50
    tools_called: [resolve_location, mssql_get_Projects_from_Location, mssql_get_clinics_for_project, api_book_Appointment]
    booked: true
    language: en

