- id: book_another_doctor_ar
  suite: booking
  title: Declines the first doctor → offered more doctors
  caller:
    language: ar
    persona: رجل عنده ألم في الركبة.
    goal: يحجز في مستشفى العليا بأقرب موعد. يوافق على العيادة اللي يقترحها الموظف. لما الموظف يقترح عليه دكتور، يقول لا أبي دكتور ثاني، وبعدين يختار أول دكتور من الأطباء الثانيين اللي يذكرهم، وياخذ أول وقت، ويوافق على الحجز.
    facts: {رقم الجوال: "0551234567", الرمز: "1234", المستشفى: العليا, الأعراض: ألم في الركبة}
    opening: ابي موعد
  max_turns: 18
  expect:
    verified: true
    max_words_per_reply: 50
    tools_called: [mssql_get_TopFive_nearestClinic_have_doctorSlots, api_book_Appointment]
    booked: true
    booked_first_doctor: false
    booked_offered_doctor: true
    say: ["دكتور|دكتورة"]
  judge_note: When the caller declines the first doctor, the agent reads the next doctors (max 3), keeps the same clinic, then books the chosen doctor after a read-back.

- id: book_decline_readback
  suite: booking
  title: Says no at the read-back → nothing is booked
  caller:
    language: ar
    persona: رجل من الرياض عنده حبوب في وجهه.
    goal: يوافق على كل شي يقترحه الموظف (العيادة، أول دكتور، أول وقت، أقرب موعد) في مستشفى العليا. بس لما الموظف يقرأ عليه تفاصيل الحجز كاملة ويسأله إذا يحجز، يغير رأيه ويقول لا ما ابي أحجز الحين، وبعدين يقول ما يبي شي ثاني.
    facts: {رقم الجوال: "0551234567", الرمز: "1234", المستشفى: العليا, الأعراض: حبوب في الوجه}
    opening: ابي احجز موعد
  max_turns: 16
  expect:
    verified: true
    max_words_per_reply: 50
    booked: false

- id: book_misheard_answers_ar
  suite: booking
  title: Replays a live call's misheard answers — loose identity yes, loose clinic yes, garbled "earliest" — no loops
  caller:
    language: ar
    script: ["ابي احجز موعد", "0551234567", "1234", "حسنا، أنا هنا", "مستشفى العليا", "أعاني من ألم في البطن", "ومناسبة", "أبي أغري في موعد مطاح"]
  expect:
    verified: true
    tools_called: [find_hospital_by_name, mssql_get_TopFive_nearestClinic_have_doctorSlots]
  judge_note: Speech recognition garbled the caller's answers. The agent should understand them (identity yes, the clinic is fine, the earliest appointment) and move on to suggesting a doctor, without asking the same question repeatedly.

- id: book_near_olaya_en
  suite: booking
  title: Replays a live call — "I'm near Olaya" is a location (nearby hospitals), and the read-back names the hospital in English
  caller:
    language: en
    script: ["Hello, I'd like to book an appointment", "0559876543", "1234", "Yes, it's me", "Currently I am located nearby Olaya.", "Olaya Hospital", "I am suffering from knee pain.", "Yes, please.", "The earliest available please", "Yes, please book with her.", "The first time please"]
  expect:
    verified: true
    tools_called: [resolve_location, mssql_get_Projects_from_Location, mssql_get_clinics_for_project]
    say: ["Olaya Hospital"]
    never_say: ["Al.?Ula|Ula Hospital"]
  judge_note: The caller described where they are ("near Olaya") — the agent must search nearby hospitals from that location and let them choose, then use the hospital's English name ("Olaya Hospital") in the English read-back.
