    persona: امرأة تعبانة من صداع قوي يجيها كل يوم من شهر. تتكلم عن نفسها بصيغة المؤنث (أنا تعبانة).
    goal: تحجز في مستشفى العليا يوم الأحد الجاي، أول دكتور وأول وقت.
    facts: {رقم الجوال: "0559876543", الرمز: "1234", المستشفى: العليا, الأعراض: صداع يومي من شهر, التاريخ: الأحد الجاي}
    opening: السلام عليكم، أنا تعبانة وابي احجز موعد
  max_turns: 16
